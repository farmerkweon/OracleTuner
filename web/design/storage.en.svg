ntity" data-qualified-name="FILES" data-source-line="12" id="ent0006"><path d="M133.5,291.6211 L174.5,291.6211 A3.75,3.75 0 0 1 177,294.1211 L184,312.6211 L290.9121,312.6211 A2.5,2.5 0 0 1 293.4121,315.1211 L293.4121,345.7422 A2.5,2.5 0 0 1 290.9121,348.2422 L133.5,348.2422 A2.5,2.5 0 0 1 131,345.7422 L131,294.1211 A2.5,2.5 0 0 1 133.5,291.6211" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><line style="stroke:#181818;stroke-width:0.5;" x1="131" x2="184" y1="312.6211" y2="312.6211"/><text fill="#000000" font-family="Segoe UI" font-size="14" lengthAdjust="spacing" textLength="132.4121" x="141" y="334.7285">File mode (JSON/.sql)</text></g><g class="entity" data-qualified-name="GMN11" data-source-line="20" id="ent0012"><path d="M35,385.6211 L35,464.7852 A0,0 0 0 0 35,464.7852 L389.2646,464.7852 A0,0 0 0 0 389.2646,464.7852 L389.2646,395.6211 L379.2646,385.6211 L216,385.6211 L212,348.7232 L208,385.6211 L35,385.6211 A0,0 0 0 0 35,385.6211" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M379.2646,385.6211 L379.2646,395.6211 L389.2646,395.6211 L379.2646,385.6211" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="326.1426" x="48.1221" y="404.6494">If node:sqlite is unavailable (e.g. an older bundled Node),</text><text fill="#000000" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="219.978" x="41" y="421.9404">it automatically falls back to file mode.</text><text fill="#000000" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="261.625" x="41" y="439.2314">There is no dual-write &#8212; exactly one backend</text><text fill="#000000" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="149.7349" x="41" y="456.5225">is ever the source of truth.</text></g><!--entity SSTORE--><g class="entity" data-qualified-name="Node Server.SSTORE" data-source-line="6" id="ent0002"><rect fill="#F1F1F